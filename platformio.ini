 ; HW-950 ESP32 公車到站提示
;
; 兩個 env 分場景：
;   [esp32dev]  螢幕 smoke test（預設，跑 LovyanGFX 顯示 + WiFi IP 顯示）
;   [tdx]       TDX API 取數驗證（不碰螢幕，純 serial）
;
; 螢幕跑通後要正式整合，把 02_screensmoke 換回 main.cpp 並把 tdx env 合併即可。

[env]
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-110
upload_protocol = esptool
upload_speed = 460800
; LovyanGFX 取代 TFT_eSPI；ArduinoJson 留著
lib_deps =
    lovyan03/LovyanGFX@^1.1.0
    bblanchon/ArduinoJson@^6.21.2
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.0.0
; smoke test 入口：正式 main.cpp（TFT_eSPI ILI9341 Hello+IP）
build_flags =
    ; TFT_eSPI 走 USER_SETUP_LOADED=1，腳位從 build_flags 注入（不改庫檔案）
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SMOOTH_FONT=1
    -D LOAD_FONT4=1
    -D TOUCH_CS=33
    -D TOUCH_SCLK=25
    -D TOUCH_MOSI=32
    -D TOUCH_MISO=39
    -D TOUCH_IRQ=36
    -D SPI_TOUCH_FREQUENCY=2500000
; 正式整合：main.cpp + 資料層模組（DisplayManager 暫緩，見 archive）
build_src_filter =
    +<main.cpp>
    +<WiFiManager.cpp>
    +<TDXClient.cpp>
    +<BusData.cpp>
    +<WxManager.cpp>
    +<TouchManager.cpp>
    +<LEDManager.cpp>
    +<SDManager.cpp>
    +<LightSensor.cpp>
    +<UIManager.cpp>
    +<Slideshow.cpp>

[env:tdx]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.21.2
build_src_filter = +<main.cpp> +<TDXClient.cpp> +<BusData.cpp>
