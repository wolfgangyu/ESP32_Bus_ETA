; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-110
upload_protocol = esptool
upload_speed = 460800
board_build.partitions = max_app_4MB.csv
lib_deps =
	lovyan03/LovyanGFX@^1.1.0
	bblanchon/ArduinoJson@^6.21.2
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TJpg_Decoder@^1.0.0
build_flags =
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=27
	-D TFT_BACKLIGHT_ON=HIGH
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D SPI_FREQUENCY=20000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D SMOOTH_FONT=1
	-D LOAD_FONT4=1
	-D USE_HSPI_PORT=1
	-D TOUCH_CS=33
	-D TOUCH_IRQ=36
	-D SPI_TOUCH_FREQUENCY=2500000
	; 注意：TFT_SDA_READ 已移除 —— 它會強制 TFT_MISO=-1（半雙工），
	;       SPI 就沒有讀取線，XPT2046 永遠讀不到（getTouch() 永遠 0）。
	; 注意：TOUCH_SCLK/MOSI/MISO 未定義 —— TFT_eSPI 內建觸控與螢幕共用
	;       SCK/MOSI/MISO(14/13/12)，只多一支 CS=33，不吃這些 flag。
	; 注意：USE_HSPI_PORT=1 —— TFT+觸控走 HSPI，VSPI(18/19/23) 完整留給 SD 卡，
	;       避免 SDManager 的 SPI.begin() 把觸控讀取帶到錯的腳位。
build_src_filter =
	+<main.cpp>
	+<WiFiManager.cpp>
	+<TDXClient.cpp>
	+<BusData.cpp>
	+<WxManager.cpp>
	+<TouchManager.cpp>
	+<LEDManager.cpp>
	+<SDManager.cpp>
	+<LightSensor.cpp>
	+<UIManager.cpp>
	+<Slideshow.cpp>

[env:tdx]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^6.21.2
	median-dispersion/XPT2046 Driver@^1.0.2
build_src_filter = +<main.cpp> +<TDXClient.cpp> +<BusData.cpp>
