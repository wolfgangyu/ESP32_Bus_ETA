[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-110
upload_protocol = esptool
upload_speed = 460800
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
build_flags = 
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=27
	-D TFT_BACKLIGHT_ON=HIGH
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D SPI_FREQUENCY=20000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D SMOOTH_FONT=1
	-D LOAD_FONT4=1
	-D TOUCH_CS=33
	-D TOUCH_SCLK=25
	-D TOUCH_MOSI=32
	-D TOUCH_MISO=39
	-D TOUCH_IRQ=36
	-D SPI_TOUCH_FREQUENCY=2500000
	-D TOUCH_DRIVER=1
	-D TOUCH_THRESHOLD=500
