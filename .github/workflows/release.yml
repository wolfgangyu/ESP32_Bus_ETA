name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check FW_VERSION matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER=$(grep -oE 'FW_VERSION\s+"[^"]+"' include/config.h | grep -oE '"[^"]+"' | tr -d '"')
          if [ -z "$VER" ]; then
            echo "ERROR: FW_VERSION not found in include/config.h"
            exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "ERROR: FW_VERSION '$VER' in config.h does not match tag '$TAG'"
            echo "Fix: update include/config.h to #define FW_VERSION \"$TAG\" before tagging"
            exit 1
          fi
          echo "OK: FW_VERSION '$VER' matches tag '$TAG'"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create config_local.h
        run: |
          cat > ${{ github.workspace }}/include/config_local.h << 'EOF'
          #ifndef CONFIG_LOCAL_H
          #define CONFIG_LOCAL_H

          // Wi-Fi 設定
          #define WIFI_SSID        "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASSWORD    "${{ secrets.WIFI_PASSWORD }}"

          // TDX API 設定
          #define TDX_CLIENT_ID    "${{ secrets.TDX_CLIENT_ID }}"
          #define TDX_CLIENT_SECRET "${{ secrets.TDX_CLIENT_SECRET }}"

          // 目標站牌
          #define TARGET_STOP_NAME "西新里(新新公園)"
          #define TARGET_STOP_WEST  "TPE12726"
          #define TARGET_STOP_EAST  "TPE12858"

          // 觸控校準參數
          #define TOUCH_CAL_X0  300
          #define TOUCH_CAL_X1  3800
          #define TOUCH_CAL_Y0  300
          #define TOUCH_CAL_Y1  3800

          #endif
          EOF

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: |
          cd ${{ github.workspace }}
          pio run -e esp32dev

      - name: Get firmware path
        id: firmware
        run: |
          FIRMWARE="${{ github.workspace }}/.pio/build/esp32dev/firmware.bin"
          echo "path=$FIRMWARE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.firmware.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}